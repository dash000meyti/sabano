services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://sabano.ir}
    image: sabano-web:latest
    container_name: sabano-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # put nginx (TLS) in front; don't expose directly
    env_file:
      - .env
    volumes:
      - sabano-data:/data
    stop_grace_period: 20s
    logging:                     # keep container logs from filling the disk
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  sabano-data:
